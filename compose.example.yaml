services:
  insomnia-fpl:
    build:
      context: .
    image: insomnia-fpl:local
    container_name: insomnia-fpl
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      DATABASE_URL: file:/app/data/insomnia-fpl.db
      APP_DATA_DIR: /app/data
      SIGNAL_INGEST_TOKEN: ${SIGNAL_INGEST_TOKEN:?set SIGNAL_INGEST_TOKEN}
      SIGNAL_CONFIG_FILE: /app/data/signal-config.json
      FPL_INGEST_CACHE_PATH: /app/data/cache/fpl-official.json
      FPL_DATA_CACHE_FILE: /app/data/cache/fpl-data.json
      SIGNAL_CACHE_DIR: /app/data/cache/signal-feeds
    ports:
      - "4173:4173"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
